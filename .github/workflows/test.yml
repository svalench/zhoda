name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
        working-directory: core
      - run: uv run ruff check .
        working-directory: core
      - run: uv run mypy src/zhoda_core/benchmarks src/zhoda_core/actions.py src/zhoda_core/stage_dtos.py
        working-directory: core
      - run: uv run pytest -m "not live"
        working-directory: core

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
        working-directory: mcp
      - run: uv run ruff check .
        working-directory: mcp
      - run: uv run mypy src
        working-directory: mcp
      - run: uv run pytest
        working-directory: mcp
