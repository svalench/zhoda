[project]
name = "zhoda-mcp"
version = "0.1.0"
description = "MCP server for Zhoda — council tools for any MCP host"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "zhoda-core",
    "mcp>=1.9,<2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
zhoda-mcp = "zhoda_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.sources]
zhoda-core = { path = "../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhoda_mcp"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["zhoda_core.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits the real OpenRouter API (needs OPENROUTER_API_KEY; runs only with -m live)",
]
